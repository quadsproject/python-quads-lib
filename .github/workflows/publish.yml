name: Publish Python Package

on:
  push:
    branches:
      - latest

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine bump2version

    - name: Configure Git
      run: |
        git config --global user.email "grafuls@gmail.com"
        git config --global user.name "Your Name"

    - name: Pull latest
      run: git pull origin latest

    - name: Bump version
      run: bump2version patch # patch, minor, major

    - name: Build package
      run: python setup.py sdist bdist_wheel

    - name: Sync changes with all branches
      run: |
        git checkout latest
        git pull origin latest --rebase
        git push origin latest
        git checkout development
        git merge latest
        git push origin development

    - name: Publish package
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: twine upload dist/*
