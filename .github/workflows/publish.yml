name: Publish Python Package

on:
  push:
    branches:
      - latest

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine bump2version

    - name: Configure Git
      run: |
        git config --global user.email "grafuls@gmail.com"
        git config --global user.name "Your Name"

    - name: Bump version
      run: bump2version minor  # patch, minor, major

    - name: Build package
      run: python setup.py sdist bdist_wheel

    - name: Publish package
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: twine upload dist/*

    - name: Push changes to latest
      uses: ad-m/github-push-action@v0.6.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: latest

    - name: Check out development branch
      run: |
        git fetch origin
        git checkout development
        git merge latest

    - name: Push changes to development
      uses: ad-m/github-push-action@v0.6.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: development
